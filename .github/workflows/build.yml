name: Build APK


on:
  push:
    branches: [ main, master ]
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"


      - name: Show project structure
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd


          echo "===== ROOT FILES ====="
          ls -la


          echo "===== APP DIRECTORY ====="
          ls -la app || true


          echo "===== SETTINGS.GRADLE.KTS ====="
          cat settings.gradle.kts


          echo "===== BUILD.GRADLE.KTS ====="
          cat build.gradle.kts


          echo "===== APP BUILD.GRADLE.KTS ====="
          cat app/build.gradle.kts


      - name: Fetch vendored TDLib files
        run: |
          mkdir -p app/src/main/java/org/drinkless/tdlib
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/x86
          mkdir -p app/src/main/jniLibs/x86_64


          BASE="https://raw.githubusercontent.com/kcvabeysinghe/EasyTDlib/main/app/src/main"


          curl -fL "$BASE/java/org/drinkless/tdlib/TdApi.java" \
            -o app/src/main/java/org/drinkless/tdlib/TdApi.java


          curl -fL "$BASE/java/org/drinkless/tdlib/Client.java" \
            -o app/src/main/java/org/drinkless/tdlib/Client.java


          curl -fL "$BASE/jniLibs/arm64-v8a/libtdjni.so" \
            -o app/src/main/jniLibs/arm64-v8a/libtdjni.so


          curl -fL "$BASE/jniLibs/armeabi-v7a/libtdjni.so" \
            -o app/src/main/jniLibs/armeabi-v7a/libtdjni.so


          curl -fL "$BASE/jniLibs/x86/libtdjni.so" \
            -o app/src/main/jniLibs/x86/libtdjni.so


          curl -fL "$BASE/jniLibs/x86_64/libtdjni.so" \
            -o app/src/main/jniLibs/x86_64/libtdjni.so


          echo "===== DOWNLOADED TDLib FILES ====="
          find app/src/main/java/org/drinkless app/src/main/jniLibs \
            -type f -exec ls -lh {} \;


      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew


      - name: Show Gradle version
        run: |
          ./gradlew --version


      - name: List all Gradle tasks
        run: |
          ./gradlew tasks --all --no-daemon


      - name: Verify Android build tasks
        run: |
          echo "===== APP TASKS ====="
          ./gradlew :app:tasks --all --no-daemon


      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace


      - name: Check APK
        run: |
          echo "===== APK OUTPUT ====="
          find app/build/outputs -type f -name "*.apk" -exec ls -lh {} \;


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tgserver-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error