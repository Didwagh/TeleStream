name: Build APK

on:
  push:
      branches: [ main, master ]
        workflow_dispatch:

        jobs:
          build:
              runs-on: ubuntu-latest
                  steps:
                        - uses: actions/checkout@v4

                              - uses: actions/setup-java@v4
                                      with:
                                                distribution: temurin
                                                          java-version: '17'

                                                                - name: Setup Android SDK
                                                                        uses: android-actions/setup-android@v3

                                                                              - name: Install SDK platform & build-tools
                                                                                      run: |
                                                                                                yes | sdkmanager --licenses || true
                                                                                                          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

                                                                                                                - name: Fetch vendored TDLib files
                                                                                                                        run: |
                                                                                                                                  mkdir -p app/src/main/java/org/drinkless/tdlib
                                                                                                                                            mkdir -p app/src/main/jniLibs/arm64-v8a
                                                                                                                                                      mkdir -p app/src/main/jniLibs/armeabi-v7a
                                                                                                                                                                mkdir -p app/src/main/jniLibs/x86
                                                                                                                                                                          mkdir -p app/src/main/jniLibs/x86_64

                                                                                                                                                                                    BASE="https://raw.githubusercontent.com/kcvabeysinghe/EasyTDlib/main/app/src/main"

                                                                                                                                                                                              curl -fsSL "$BASE/java/org/drinkless/tdlib/TdApi.java" -o app/src/main/java/org/drinkless/tdlib/TdApi.java
                                                                                                                                                                                                        curl -fsSL "$BASE/java/org/drinkless/tdlib/Client.java" -o app/src/main/java/org/drinkless/tdlib/Client.java
                                                                                                                                                                                                                  curl -fsSL "$BASE/jniLibs/arm64-v8a/libtdjni.so" -o app/src/main/jniLibs/arm64-v8a/libtdjni.so
                                                                                                                                                                                                                            curl -fsSL "$BASE/jniLibs/armeabi-v7a/libtdjni.so" -o app/src/main/jniLibs/armeabi-v7a/libtdjni.so
                                                                                                                                                                                                                                      curl -fsSL "$BASE/jniLibs/x86/libtdjni.so" -o app/src/main/jniLibs/x86/libtdjni.so
                                                                                                                                                                                                                                                curl -fsSL "$BASE/jniLibs/x86_64/libtdjni.so" -o app/src/main/jniLibs/x86_64/libtdjni.so

                                                                                                                                                                                                                                                          echo "Downloaded files:"
                                                                                                                                                                                                                                                                    find app/src/main/java/org/drinkless app/src/main/jniLibs -type f -exec ls -la {} \;

                                                                                                                                                                                                                                                                          - uses: gradle/actions/setup-gradle@v4
                                                                                                                                                                                                                                                                                  with:
                                                                                                                                                                                                                                                                                            gradle-version: 8.7

                                                                                                                                                                                                                                                                                                  - name: Build debug APK
                                                                                                                                                                                                                                                                                                          run: gradle :app:assembleDebug --no-daemon

                                                                                                                                                                                                                                                                                                                - uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                                                                  name: tgserver-debug-apk
                                                                                                                                                                                                                                                                                                                                            path: app/build/outputs/apk/debug/app-debug.apk